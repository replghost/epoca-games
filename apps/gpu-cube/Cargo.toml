[package]
name = "epoca-gpu-cube"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
epoca-gpu = { path = "../../crates/epoca-gpu", features = ["pvm"] }
libm = "=0.2.15"
linked_list_allocator = { version = "=0.10.5", default-features = false }
polkavm-derive = "=0.31.0"

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
panic = "abort"
